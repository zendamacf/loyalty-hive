services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: loyaltyhive
      POSTGRES_PASSWORD: ${DB_PASSWORD:-loyaltyhive}
      POSTGRES_DB: loyaltyhive
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loyaltyhive -d loyaltyhive']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ${APP_IMAGE:-ghcr.io/zendamacf/loyalty-hive-api:latest}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgresql://loyaltyhive:${DB_PASSWORD:-loyaltyhive}@postgres:5432/loyaltyhive
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      FILE_STORAGE_URL: ${FILE_STORAGE_URL}
      SENTRY_DSN: ${SENTRY_DSN:-}
      PORT: 3000
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bun -e "fetch(\"http://127.0.0.1:3000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
