name: PR Checks

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - 'packages/admin/**'
      - '.github/workflows/admin-pr-checks.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-admin
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-admin:
    name: check-admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint
        working-directory: packages/admin

      - name: Run typecheck
        run: bun run typecheck
        working-directory: packages/admin

      - name: Run test
        run: bun run test
        working-directory: packages/admin

      - name: Build
        run: bun run build
        working-directory: packages/admin
