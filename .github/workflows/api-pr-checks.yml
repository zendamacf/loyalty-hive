name: PR Checks

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - 'packages/api/**'
      - '.github/workflows/api-pr-checks.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  pull-requests: write

jobs:
  check-api:
    name: check-api
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-api
      cancel-in-progress: false

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loyaltyhive
          POSTGRES_PASSWORD: loyaltyhive
          POSTGRES_DB: loyaltyhive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loyaltyhive -d loyaltyhive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://loyaltyhive:loyaltyhive@localhost:5432/loyaltyhive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Migrations
        run: bun run db:migrate
        working-directory: packages/api

      - name: Run lint
        run: bun run lint
        working-directory: packages/api

      - name: Run typecheck
        run: bun run typecheck
        working-directory: packages/api

      - name: Run test
        run: LIB_VERSION=$(npm run -s prebuild) bun test --preload ./test/setup.ts --coverage-reporter=lcov
        working-directory: packages/api

      - name: Load coverage thresholds
        id: coverage-thresholds
        working-directory: packages/api
        run: |
          bun -e "
            const { test: t } = Bun.TOML.parse(await Bun.file('bunfig.toml').text());
            console.log('lines=' + t.coverageThresholds.lines);
            console.log('functions=' + t.coverageThresholds.functions);
          " >> "$GITHUB_OUTPUT"

      - name: Enforce function coverage threshold
        working-directory: packages/api
        run: |
          MIN="${{ steps.coverage-thresholds.outputs.functions }}"
          RATE=$(bun -e "
            let fnf = 0, fnh = 0;
            for (const line of await Bun.file('coverage/lcov.info').text().then((t) => t.split('\n'))) {
              if (line.startsWith('FNF:')) fnf += Number(line.slice(4));
              if (line.startsWith('FNH:')) fnh += Number(line.slice(4));
            }
            console.log(fnf ? ((fnh / fnf) * 100).toFixed(2) : '100.00');
          ")
          echo "Function coverage: ${RATE}% (minimum ${MIN}%)"
          awk -v rate="$RATE" -v min="$MIN" 'BEGIN { exit (rate + 0 >= min + 0 ? 0 : 1) }' \
            || { echo "::error::Function coverage ${RATE}% is below minimum ${MIN}%"; exit 1; }

      - name: Report coverage on PR
        uses: mcclurejt/cover-2@1.0.1
        with:
          head-lcov-file: coverage/lcov.info
          comment-header: api-coverage
          thresholds: ${{ steps.coverage-thresholds.outputs.lines }} 100
          fail-below-threshold: true
          show-function-coverage: true
          working-directory: packages/api

  deploy-smoke:
    name: deploy-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI env file
        working-directory: packages/api
        run: |
          {
            echo 'DB_PASSWORD=loyaltyhive'
            echo 'JWT_ACCESS_SECRET=ci-dummy-jwt-secret'
            echo 'FILE_STORAGE_URL=http://localhost:3000/'
            echo 'APP_IMAGE=loyalty-hive-api:ci'
          } > .env

      - name: Build and start Compose stack
        working-directory: packages/api
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait

      - name: Smoke test health endpoint
        run: curl -sf http://localhost:3000/health | grep -q ok

      - name: Smoke test brand logo
        run: curl -sfI http://localhost:3000/logos/mecca-v2.png | grep -qi 'image/png'

      - name: Smoke test OpenAPI document
        run: curl -sf http://localhost:3000/doc | grep -q '"openapi"'

      - name: Smoke test auth-protected route
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/v1/brands)
          test "$code" = "401"

      - name: Verify migrations applied
        working-directory: packages/api
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T postgres \
            psql -U loyaltyhive -d loyaltyhive -c '\dt' | grep -q brands

      - name: Tear down
        if: always()
        working-directory: packages/api
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
