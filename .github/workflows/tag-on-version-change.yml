name: Tag package releases

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - packages/api/package.json
      - packages/app/package.json

jobs:
  tag-releases:
    name: Tag package releases
    runs-on: ubuntu-latest

    steps:
      - name: Require REPO_PAT
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          if [ -z "${REPO_PAT}" ]; then
            echo "::error::REPO_PAT repository secret is required. Add a PAT with contents:write scope so tag pushes trigger publish-docker and app-android-build (GITHUB_TOKEN tag pushes do not)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PAT so tag pushes trigger downstream workflows (GITHUB_TOKEN suppresses them).
          token: ${{ secrets.REPO_PAT }}
          fetch-depth: 0

      - name: Create and push tags
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            changed=$(git diff --name-only HEAD~1 HEAD)
          else
            changed=$(git diff --name-only "$before" "${{ github.sha }}")
          fi

          tag_if_new() {
            local tag="$1"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists; skipping."
            else
              git tag "$tag"
              git push origin "$tag"
              echo "Pushed $tag"
            fi
          }

          if echo "$changed" | grep -qx 'packages/api/package.json'; then
            version=$(node -p "require('./packages/api/package.json').version")
            tag_if_new "api-v${version}"
          fi

          if echo "$changed" | grep -qx 'packages/app/package.json'; then
            version=$(node -p "require('./packages/app/package.json').version")
            tag_if_new "app-v${version}"
          fi
