name: Dependabot Changeset

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  changeset:
    runs-on: ubuntu-latest
    if: >-
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch pull request base
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"

      - uses: dependabot/fetch-metadata@v2
        id: metadata

      - name: Write changeset
        env:
          DEPS: ${{ steps.metadata.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
          UPDATED_DEPS_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          SAFE_BRANCH=$(echo "$HEAD_REF" | sed 's/\//-/g')
          LEGACY_FILE=".changeset/${SAFE_BRANCH}.md"
          API_FILE=".changeset/${SAFE_BRANCH}-api.md"
          APP_FILE=".changeset/${SAFE_BRANCH}-app.md"

          rm -f "$LEGACY_FILE"

          filter_deps_for_package() {
            local pkg_json="$1"
            local keys
            keys=$(jq -c '(.dependencies + .devDependencies) | keys' "$pkg_json")
            echo "$UPDATED_DEPS_JSON" | jq -c --argjson keys "$keys" '
              [.[] | select(.dependencyName as $d | $keys | index($d) != null)]
            '
          }

          build_description() {
            local deps_json="$1"
            local description
            description=$(echo "$deps_json" | jq -r '
              if type == "array" and length > 0 then
                map(
                  if (.prevVersion // "") != "" and (.newVersion // "") != "" then
                    "\(.dependencyName) from \(.prevVersion) to \(.newVersion)"
                  else
                    .dependencyName
                  end
                ) | join(", ")
              else
                empty
              end
            ')

            if [ -z "$description" ]; then
              if [ -n "$PREVIOUS_VERSION" ] && [ -n "$NEW_VERSION" ]; then
                description="${DEPS} from ${PREVIOUS_VERSION} to ${NEW_VERSION}"
              else
                description="${DEPS}"
              fi
            fi

            printf '%s' "$description"
          }

          build_body() {
            local description="$1"
            if [ -n "$UPDATE_TYPE" ]; then
              printf 'Updated %s (%s).\n' "$description" "$UPDATE_TYPE"
            else
              printf 'Updated %s.\n' "$description"
            fi
          }

          write_changeset() {
            local file="$1"
            local pkg="$2"
            local deps_json="$3"
            local description body

            if [ "$(echo "$deps_json" | jq 'length')" -eq 0 ]; then
              echo "No matching dependencies for ${pkg}; skipping changeset."
              rm -f "$file"
              return
            fi

            description=$(build_description "$deps_json")
            body=$(build_body "$description")
            {
              printf '%s\n' "---"
              printf '"%s": patch\n' "$pkg"
              printf '%s\n\n' "---"
              printf '%s' "$body"
            } > "$file"
          }

          CHANGED_PKG_FILES=$(
            git diff --name-only "$BASE_SHA" HEAD -- \
              package.json \
              packages/api/package.json \
              packages/app/package.json
          )

          API_CHANGED=false
          APP_CHANGED=false
          if echo "$CHANGED_PKG_FILES" | grep -qx 'packages/api/package.json'; then
            API_CHANGED=true
          fi
          if echo "$CHANGED_PKG_FILES" | grep -qx 'packages/app/package.json'; then
            APP_CHANGED=true
          fi

          if [ "$API_CHANGED" = false ] && [ "$APP_CHANGED" = false ]; then
            if echo "$CHANGED_PKG_FILES" | grep -qx 'package.json'; then
              echo "Only root package.json changed; skipping workspace changeset."
              rm -f "$API_FILE" "$APP_FILE"
              exit 0
            fi

            if [ "$(filter_deps_for_package packages/api/package.json | jq 'length')" -gt 0 ]; then
              API_CHANGED=true
            fi
            if [ "$(filter_deps_for_package packages/app/package.json | jq 'length')" -gt 0 ]; then
              APP_CHANGED=true
            fi
          fi

          if [ "$API_CHANGED" = true ]; then
            write_changeset "$API_FILE" "@loyalty-hive/api" "$(filter_deps_for_package packages/api/package.json)"
          else
            rm -f "$API_FILE"
          fi

          if [ "$APP_CHANGED" = true ]; then
            write_changeset "$APP_FILE" "@loyalty-hive/app" "$(filter_deps_for_package packages/app/package.json)"
          else
            rm -f "$APP_FILE"
          fi

      - name: Commit changeset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .changeset/
          git diff --staged --quiet && exit 0
          git commit -m "chore: add changeset for dependency update"
          git push
